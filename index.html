<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nonna's Marbles</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  box-sizing:border-box;

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{

  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;border-radius:calc(var(--u)*14);background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}

  background:rgba(5,19,15,.6);border:calc(var(--u)*1.5) solid rgba(224,169,59,.55);

.btns button:focus-visible,#ovBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btns svg{width:55%;height:55%;fill:currentColor}

#bPower:not(:disabled){background:#e0a93b;color:#2a1a00;box-shadow:0 calc(var(--u)*3) 0 #9a6b12}
#bPower:focus-visible{outline:3px solid #fff;outline-offset:2px}

#bar{position:absolute;left:calc(var(--u)*14);right:calc(var(--u)*14);top:calc(var(--u)*66);height:calc(var(--u)*5);border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}

  position:absolute;inset:0;display:none;align-items:center;justify-content:center;

}
#ov.show{display:flex}
.card{
  width:80%;padding:calc(var(--u)*26) calc(var(--u)*20) calc(var(--u)*24);text-align:center;
  background:linear-gradient(#17413a,#0d2823);
  border:calc(var(--u)*2.5) solid var(--gold);border-radius:calc(var(--u)*20);
  box-shadow:inset 0 0 0 calc(var(--u)*4) rgba(0,0,0,.25),0 calc(var(--u)*12) calc(var(--u)*34) rgba(0,0,0,.55);
}
.card h1{font-weight:400;font-size:calc(var(--u)*42);line-height:1.05;text-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.45)}

  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:calc(var(--u)*14.5);line-height:1.45;opacity:.92;margin:calc(var(--u)*12) auto calc(var(--u)*20);max-width:30ch;
}
#ovBtn{
  font-family:inherit;font-size:calc(var(--u)*22);padding:calc(var(--u)*10) calc(var(--u)*38);
  border:0;border-radius:999px;background:var(--gold);color:#2a1a00;cursor:pointer;
  box-shadow:0 calc(var(--u)*4) 0 #9a6b12;
}
#ovBtn:active{transform:translateY(calc(var(--u)*2));box-shadow:0 calc(var(--u)*2) 0 #9a6b12}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="stat"><span class="lbl">Score</span><span id="score">0</span></div>
      <div class="stat mid"><span class="lbl">Level</span><span id="lvl">1</span></div>
      <div class="btns">
        <button id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <button id="bSound" aria-label="Sound on"></button>
      </div>
    </div>
    <div id="bar"><i id="barFill"></i></div>
    <div id="fx"></div>
        <div id="ov" class="show">
      <div class="card">
        <h1 id="ovT">Nonna's Marbles</h1>
        <p id="ovB"></p>
        <button id="ovBtn">Play</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 360, H = 640, CX = 180, CY = 340, R = 14, D = 28, PULL = 300, BACK = 240, SHOT = 780, TAU = Math.PI * 2;

  { base:'#22b573', hi:'#92f2c0', lo:'#0b5c3a', glyph:'triangle' },
  { base:'#2f7bf0', hi:'#a3c9ff', lo:'#12348a', glyph:'square'   },
  { base:'#9a5be0', hi:'#d8b8ff', lo:'#4a1f85', glyph:'star'     },
  { base:'#e8e4d8', hi:'#ffffff', lo:'#8a8472', glyph:'cross'    }
];
const START_S = 45;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), wrap = $('wrap');
const rnd = n => Math.floor(Math.random() * n);

/* ---------- path: leader from below the screen, then a spiral inward ---------- */
const pts = []; let L = 0;
(function buildPath(){
  const raw = [[CX - 162, H + 30], [CX - 162, CY]];
  const th0 = Math.PI, th1 = Math.PI * 5, r0 = 162, r1 = 84, steps = 1000;

  for (let i = 1; i < raw.length; i++) {
    const b = raw[i];
    let dx = b[0] - last[0], dy = b[1] - last[1], d = Math.hypot(dx, dy);
    while (d >= 1) {

      dx = b[0] - last[0]; dy = b[1] - last[1]; d = Math.hypot(dx, dy);
    }
  }
  L = pts.length - 1;
})();
function posAt(s){
  if (s <= 0) return { x: pts[0][0], y: pts[0][1] };
  if (s >= L) return { x: pts[L][0], y: pts[L][1] };
  const i = s | 0, f = s - i, a = pts[i], b = pts[i + 1];
  return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f };
}

/* ---------- state ---------- */
let state = 'menu', prevState = 'play';
let level = 1, score = 0, best = 0, nc = 4, remaining = 0, total = 1, chainMul = 0;
let balls = [], shots = [], parts = [], pops = [];
let cur = 0, nxt = 1, reload = 0, frogA = -Math.PI / 2, aimA = -Math.PI / 2;
let rush = true, rewPending = false;
let mood = '', moodT = 0, lastSay = 0, voiceIt = null, speechOK = false, rings = [], lastFx = '';
let slot = null, slowT = 0, rewT = 0, bombArmed = false, sinceP = 0;
let down = false, downSwap = false, ptype = 'touch', time = 0, px = 1;
try { best = +localStorage.getItem('frogstone-best') || 0; } catch (e) {}

/* ---------- audio ---------- */
let AC = null, muted = false;
function audio(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, t, type, vol, slide){

  const n = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, n);

}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- sprites and background ---------- */
let spr = [], bgC = document.createElement('canvas');
function glyph(g, kind, x, y, r){
  g.beginPath();
  if (kind === 'circle') g.arc(x, y, r * .7, 0, TAU);
  else if (kind === 'diamond') { g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); }
  else if (kind === 'triangle') { g.moveTo(x, y - r); g.lineTo(x + r, y + r * .8); g.lineTo(x - r, y + r * .8); g.closePath(); }
  else if (kind === 'square') g.rect(x - r * .75, y - r * .75, r * 1.5, r * 1.5);
  else if (kind === 'star') {
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r * 1.05;
      const sx = x + Math.cos(a) * rr, sy = y + Math.sin(a) * rr;
      i ? g.lineTo(sx, sy) : g.moveTo(sx, sy);
    }
    g.closePath();

  g.fill();
}
function buildSprites(){
  spr = COLORS.map((col, ci) => {
    const s = Math.ceil((2 * R + 6) * px), c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d'); g.scale(px, px);
    const m = R + 3;
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(m, m + 2.2, R, R * .92, 0, 0, TAU); g.fill();
    const gr = g.createRadialGradient(m - 4, m - 5, 1.5, m, m, R);
    gr.addColorStop(0, col.hi); gr.addColorStop(.5, col.base); gr.addColorStop(1, col.lo);
    g.fillStyle = gr; g.beginPath(); g.arc(m, m, R, 0, TAU); g.fill();
    g.lineWidth = 1; g.strokeStyle = 'rgba(0,0,0,.35)'; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.ellipse(m - 4.5, m - 5.5, 4, 2.4, -.7, 0, TAU); g.fill();
    return c;
  });
}
function decor(g){

  g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 3;

  g.fillStyle = '#56626d'; g.fillRect(-26, -14, 52, 34);
  g.fillStyle = '#3d4852'; g.beginPath(); g.ellipse(-30, -4, 5, 3, 0, 0, TAU); g.fill(); g.beginPath(); g.ellipse(30, -4, 5, 3, 0, 0, TAU); g.fill();
  g.fillStyle = '#6d7a86'; g.beginPath(); g.ellipse(0, -14, 28, 6, 0, 0, TAU); g.fill();
  g.fillStyle = '#b3261e'; g.beginPath(); g.ellipse(0, -14, 22, 4, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(-20, -8, 5, 24);
  g.restore();
  // framed portrait of a stern gentleman, top right
  g.save(); g.translate(318, 130);
  g.fillStyle = '#6b4a24'; g.fillRect(-26, -34, 52, 68);
  g.fillStyle = '#b9a77f'; g.fillRect(-21, -29, 42, 58);
  g.fillStyle = '#2b2b30'; g.fillRect(-21, 14, 42, 15);
  g.fillStyle = '#e8e0cc'; g.beginPath(); g.moveTo(-5, 14); g.lineTo(0, 22); g.lineTo(5, 14); g.closePath(); g.fill();
  g.fillStyle = '#d4a982'; g.beginPath(); g.ellipse(0, -3, 11, 14, 0, 0, TAU); g.fill();
  g.fillStyle = '#4a4a4f'; g.beginPath(); g.ellipse(0, -12, 11.5, 7, 0, Math.PI, TAU); g.fill();
  g.fillStyle = '#222'; g.beginPath(); g.arc(-4.5, -4, 1.3, 0, TAU); g.fill(); g.beginPath(); g.arc(4.5, -4, 1.3, 0, TAU); g.fill();
  g.strokeStyle = '#333'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(-8, -8); g.lineTo(-2, -6); g.stroke(); g.beginPath(); g.moveTo(8, -8); g.lineTo(2, -6); g.stroke();
  g.fillStyle = '#2a2a2e';
  g.beginPath(); g.ellipse(-4.5, 4, 5.5, 2.2, .25, 0, TAU); g.fill(); g.beginPath(); g.ellipse(4.5, 4, 5.5, 2.2, -.25, 0, TAU); g.fill();
  g.fillStyle = '#111'; g.beginPath(); g.moveTo(-26, -34); g.lineTo(-8, -34); g.lineTo(-26, -16); g.closePath(); g.fill();
  g.restore();
  // very unimpressed cat, bottom right
  g.save(); g.translate(305, 592);
  g.strokeStyle = '#b86a22'; g.lineWidth = 8; g.beginPath(); g.moveTo(34, 6); g.bezierCurveTo(52, 4, 52, -22, 38, -26); g.stroke();
  g.fillStyle = '#c97a2b'; g.beginPath(); g.ellipse(6, 8, 36, 22, 0, 0, TAU); g.fill();
  g.strokeStyle = '#a45f1c'; g.lineWidth = 3;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(10 + i * 9, -10); g.lineTo(12 + i * 9, -2); g.stroke(); }
  g.fillStyle = '#c97a2b'; g.beginPath(); g.arc(-26, -2, 16, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(-38, -12); g.lineTo(-36, -30); g.lineTo(-26, -16); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-26, -16); g.lineTo(-17, -30); g.lineTo(-14, -12); g.closePath(); g.fill();
  g.fillStyle = '#f4e04d'; g.beginPath(); g.ellipse(-32, -4, 4, 3, 0, 0, TAU); g.fill(); g.beginPath(); g.ellipse(-20, -4, 4, 3, 0, 0, TAU); g.fill();
  g.fillStyle = '#222'; g.beginPath(); g.ellipse(-32, -4, 1, 2.5, 0, 0, TAU); g.fill(); g.beginPath(); g.ellipse(-20, -4, 1, 2.5, 0, 0, TAU); g.fill();
  g.strokeStyle = '#5a3410'; g.lineWidth = 2.2;
  g.beginPath(); g.moveTo(-37, -11); g.lineTo(-29, -7); g.stroke(); g.beginPath(); g.moveTo(-15, -11); g.lineTo(-23, -7); g.stroke();
  g.lineWidth = 1.4; g.beginPath(); g.arc(-26, 10, 4, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  g.fillStyle = '#e8d3b0'; g.beginPath(); g.ellipse(-22, 26, 9, 4, 0, 0, TAU); g.fill(); g.beginPath(); g.ellipse(-2, 28, 9, 4, 0, 0, TAU); g.fill();
  g.restore();
  // tea towel, bottom centre
  g.save(); g.translate(180, 598); g.rotate(-.04);
  g.fillStyle = '#e9e2cc'; g.fillRect(-62, -24, 124, 48);
  g.fillStyle = '#b3261e'; g.fillRect(-62, -24, 124, 5); g.fillRect(-62, 19, 124, 5); g.fillRect(-62, -16, 124, 2); g.fillRect(-62, 14, 124, 2);
  g.font = "22px 'Lilita One','Trebuchet MS',sans-serif"; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('Mangia!', 0, 1);
  g.restore();
  // bowl of lemons, bottom left
  g.save(); g.translate(78, 606);
  g.fillStyle = '#f2d03b';
  for (const [x, y] of [[-12, -5], [0, -10], [12, -5]]) { g.beginPath(); g.ellipse(x, y, 9, 7, 0, 0, TAU); g.fill(); }
  g.fillStyle = '#8c5a2b'; g.beginPath(); g.ellipse(0, 0, 26, 16, 0, 0, Math.PI); g.fill();
  g.strokeStyle = '#a8743a'; g.lineWidth = 3; g.beginPath(); g.moveTo(-26, 0); g.lineTo(26, 0); g.stroke();
  g.restore();
  g.restore();
}
function buildBg(){
  bgC.width = cv.width; bgC.height = cv.height;
  const g = bgC.getContext('2d'); g.setTransform(px, 0, 0, px, 0, 0);
  g.fillStyle = '#0e3228'; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.05)';
  for (let y = 0; y < H; y += 40) g.fillRect(0, y, W, 20);
  for (let x = 0; x < W; x += 40) g.fillRect(x, 0, 20, H);
  decor(g);
  const rg = g.createRadialGradient(CX, CY, 100, CX, CY, 440);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);

  for (let i = 0; i < 320; i++) {
    g.fillStyle = rr() < .5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.18)';
    g.beginPath(); g.arc(rr() * W, rr() * H, rr() * 1.4 + .3, 0, TAU); g.fill();
  }
  const trace = () => {
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 3; i <= L; i += 3) g.lineTo(pts[i][0], pts[i][1]);
    g.lineTo(pts[L][0], pts[L][1]);

  trace(); g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 42; g.stroke();
  trace(); g.strokeStyle = '#3f7367'; g.lineWidth = 36; g.stroke();
  trace(); g.strokeStyle = '#17332e'; g.lineWidth = 34; g.stroke();
  trace(); g.strokeStyle = '#0a1b18'; g.lineWidth = 31; g.stroke();
  trace(); g.setLineDash([.1, 14]); g.strokeStyle = 'rgba(224,169,59,.3)'; g.lineWidth = 3.2; g.stroke(); g.setLineDash([]);
  const hx = pts[L][0], hy = pts[L][1];
  const hg = g.createRadialGradient(hx, hy, 2, hx, hy, 24);
  hg.addColorStop(0, '#000'); hg.addColorStop(1, '#06120f');
  g.fillStyle = hg; g.beginPath(); g.arc(hx, hy, 24, 0, TAU); g.fill();
  g.lineWidth = 3; g.strokeStyle = '#e0a93b'; g.stroke();
  g.lineWidth = 1.5; g.strokeStyle = 'rgba(224,169,59,.4)'; g.beginPath(); g.arc(hx, hy, 17, 0, TAU); g.stroke();
}
function resize(){
  const r = wrap.getBoundingClientRect();
  const sc = Math.min(r.width / W, r.height / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  stage.style.width = W * sc + 'px'; stage.style.height = H * sc + 'px';
  stage.style.setProperty('--u', sc + 'px');
  cv.width = Math.round(W * sc * dpr); cv.height = Math.round(H * sc * dpr);
  px = cv.width / W;
  buildBg(); buildSprites();
}

/* ---------- chain logic ---------- */
const attached = i => balls[i - 1].s - balls[i].s <= D + 1.5;
function baseV(){
  if (rewT > 0) return -130;
  let v = Math.min(40, 11 + 2 * level);
  const h = balls[0];
  v += (rush && h && h.s < 320 ? 110 * (1 - h.s / 320) : 0);
  return slowT > 0 ? v * .1 : v;
}
function pickColor(){
  if (!balls.length) return rnd(nc);
  const cs = [...new Set(balls.map(b => b.c))];
  return cs[rnd(cs.length)];
}
function validateAmmo(){
  if (!balls.length) return;
  if (!balls.some(b => b.c === cur)) cur = pickColor();
  if (!balls.some(b => b.c === nxt)) nxt = pickColor();
}
function spawnColor(){
  const n = balls.length;
  let c = rnd(nc);
  if (n >= 2 && balls[n - 1].c === balls[n - 2].c && c === balls[n - 1].c) c = (c + 1 + rnd(nc - 1)) % nc;
  return c;
}
const SCOLD = ['Ma che fai?!', 'Madonna mia!', 'Ma sei matto?!', 'Che disastro!', 'Mamma mia, no!', 'Ma dai!'];
const PRAISE = ['Bravo!', 'Bravissimo, tesoro!', 'Che bravo!', 'Mangia, mangia!', 'Ecco, così!', 'Bene, bene!'];
function say(text, m, force){
  const now = performance.now();
  if (!force && now - lastSay < 3500) return;
  lastSay = now; mood = m; moodT = 1.5;
  pops.push({ x: CX, y: CY - 58, t: text, life: 1.7, size: 19 });
}
const PN = { slow: 'Slow', rew: 'Rewind', bomb: 'Bomb' };
function spawnPower(){

    ctx.fillStyle = 'rgba(243,234,210,.55)';
    for (let d = 52; d < t - 12; d += 14) { ctx.beginPath(); ctx.arc(CX + ca * d, CY + sa * d, 1.9, 0, TAU); ctx.fill(); }
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(243,234,210,.6)';
    ctx.beginPath(); ctx.arc(CX + ca * t, CY + sa * t, 6, 0, TAU); ctx.stroke();
  }
  for (const s of shots) { if (s.bomb) bombIcon(s.x, s.y); else ball(s.c, s.x, s.y); }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const r of rings) { ctx.globalAlpha = Math.max(0, r.life * 2); ctx.lineWidth = 4; ctx.strokeStyle = '#ffb347'; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const p of pops) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.font = p.size + "px 'Lilita One','Trebuchet MS',sans-serif";
    const hw = ctx.measureText(p.t).width / 2 + 10;
    const tx = Math.max(hw, Math.min(W - hw, p.x)), ty = Math.max(p.size + 6, Math.min(H - 8, p.y));
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.strokeText(p.t, tx, ty);
    ctx.fillStyle = '#f3ead2'; ctx.fillText(p.t, tx, ty);
  }
  ctx.globalAlpha = 1;
}

/* ---------- HUD and overlay ---------- */
let lastScore = -1, lastLevel = -1;
function hud(){
  if (score !== lastScore) { $('score').textContent = score.toLocaleString(); lastScore = score; }
  if (level !== lastLevel) { $('lvl').textContent = level; lastLevel = level; }
  let fx = '';
  if (bombArmed) fx = 'Bomb armed: fire it!'; else if (slowT > 0) fx = 'Slow ' + Math.ceil(slowT) + 's'; else if (rewT > 0) fx = 'Rewinding';
  if (fx !== lastFx) { const fe = $('fx'); fe.textContent = fx; fe.classList.toggle('on', !!fx); lastFx = fx; }
  const f = state === 'menu' ? 0 : 1 - (remaining + balls.length) / total;
  $('barFill').style.width = Math.max(0, Math.min(100, f * 100)) + '%';
}
let ovFn = null;
function showOverlay(t, b, btn, fn){
  $('ovT').textContent = t; $('ovB').textContent = b; $('ovBtn').textContent = btn; ovFn = fn;
  $('ov').classList.add('show');
}
function hideOverlay(){ $('ov').classList.remove('show'); }
$('ovBtn').addEventListener('click', () => { audio(); if (ovFn) ovFn(); });
const iconOn = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const iconOff = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
$('bSound').innerHTML = iconOn;
$('bSound').addEventListener('click', () => {
  audio(); muted = !muted;
  $('bSound').innerHTML = muted ? iconOff : iconOn;
  $('bSound').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
});
function pause(){
  if (state !== 'play') return;
  prevState = state; state = 'paused'; down = false;
  showOverlay('Paused', 'Score ' + score.toLocaleString() + '.', 'Resume', () => { state = prevState; hideOverlay(); });
}
$('bPause').addEventListener('click', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- input ---------- */
function pt(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function aimTo(p){ if (Math.hypot(p.x - CX, p.y - CY) > 12) aimA = Math.atan2(p.y - CY, p.x - CX); }
cv.addEventListener('pointerdown', e => {
  audio(); ptype = e.pointerType; if (state !== 'play') return;
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = pt(e); down = true; downSwap = Math.hypot(p.x - CX, p.y - CY) < 40;
  if (!downSwap) aimTo(p);
});
cv.addEventListener('pointermove', e => {
  ptype = e.pointerType;
  if (state === 'play' && (down || e.pointerType === 'mouse')) { const p = pt(e); if (!(down && downSwap)) aimTo(p); }
});
cv.addEventListener('pointerup', e => {
  if (!down) return; down = false;
  const p = pt(e);
  if (downSwap && Math.hypot(p.x - CX, p.y - CY) < 40) swap();
  else { aimTo(p); fire(p.x, p.y); }
});
cv.addEventListener('pointercancel', () => { down = false; });
window.addEventListener('keydown', e => { if (e.code === 'Space' && state === 'play') { e.preventDefault(); swap(); } });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

/* ---------- boot ---------- */
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildBg);
demoChain();
showOverlay('Nonna\'s Marbles', 'Tap where you want to shoot, or hold and drag to line up a shot, then let go to fire. Tap Nonna to swap marbles. Match three or more of a color before the chain reaches the hole.', 'Play', startGame);
let lastT = 0;
function frame(t){
  const dt = Math.min(.033, (t - lastT) / 1000 || 0); lastT = t; time += dt;
  if (state !== 'paused') update(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
