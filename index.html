<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nonna's Marbles</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  box-sizing:border-box;
  --bg:#05130f;--ink:#f3ead2;--gold:#e0a93b;--u:1px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;background:var(--bg);color:var(--ink);
  font-family:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;border-radius:calc(var(--u)*14);background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{
  position:absolute;left:0;right:0;top:0;
  display:flex;justify-content:flex-start;align-items:flex-start;gap:calc(var(--u)*10);
  padding:calc(var(--u)*12) calc(var(--u)*14) calc(var(--u)*24);pointer-events:none;
  background:linear-gradient(90deg,rgba(5,19,15,.8),rgba(5,19,15,.55) 50%,rgba(5,19,15,0) 76%);
}
.stat{text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.5);display:flex;flex-direction:column;font-size:calc(var(--u)*28);line-height:1;min-width:calc(var(--u)*72)}
.stat.mid{align-items:center}
.lbl{font-size:calc(var(--u)*12);opacity:.7;letter-spacing:.05em;margin-bottom:calc(var(--u)*3)}
.btns{display:flex;gap:calc(var(--u)*8);pointer-events:auto;justify-content:flex-start}
.btns button{
  width:calc(var(--u)*38);height:calc(var(--u)*38);border-radius:50%;
  background:rgba(5,19,15,.6);border:calc(var(--u)*1.5) solid rgba(224,169,59,.55);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;
}
.btns button:focus-visible,#ovBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btns svg{width:55%;height:55%;fill:currentColor}
#bPower{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*26);
  min-width:calc(var(--u)*150);height:calc(var(--u)*46);padding:0 calc(var(--u)*20);
  font-family:inherit;font-size:calc(var(--u)*18);color:var(--ink);cursor:pointer;
  background:rgba(5,19,15,.65);border:calc(var(--u)*2) solid var(--gold);border-radius:999px;
}
#bPower:disabled{opacity:.45;border-style:dashed;cursor:default}
#bPower:not(:disabled){background:#e0a93b;color:#2a1a00;box-shadow:0 calc(var(--u)*3) 0 #9a6b12}
#bPower:focus-visible{outline:3px solid #fff;outline-offset:2px}
#fx{
  position:absolute;left:50%;top:calc(var(--u)*80);transform:translateX(-50%);display:none;
  padding:calc(var(--u)*5) calc(var(--u)*16);border-radius:999px;white-space:nowrap;
  background:rgba(5,19,15,.85);border:calc(var(--u)*1.5) solid var(--gold);font-size:calc(var(--u)*17);
}
#fx.on{display:block}
#bar{position:absolute;left:calc(var(--u)*14);width:calc(var(--u)*178);top:calc(var(--u)*66);height:calc(var(--u)*5);border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
#barFill{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width .25s}
#ov{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(3,12,9,.5);
}
#ov.show{display:flex}
.card{
  width:80%;padding:calc(var(--u)*26) calc(var(--u)*20) calc(var(--u)*24);text-align:center;
  background:linear-gradient(#17413a,#0d2823);
  border:calc(var(--u)*2.5) solid var(--gold);border-radius:calc(var(--u)*20);
  box-shadow:inset 0 0 0 calc(var(--u)*4) rgba(0,0,0,.25),0 calc(var(--u)*12) calc(var(--u)*34) rgba(0,0,0,.55);
}
.card h1{font-weight:400;font-size:calc(var(--u)*42);line-height:1.05;text-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.45)}
.card p{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:calc(var(--u)*14.5);line-height:1.45;opacity:.92;margin:calc(var(--u)*12) auto calc(var(--u)*20);max-width:30ch;
}
#ovImg{display:block;width:calc(var(--u)*130);height:calc(var(--u)*130);margin:calc(var(--u)*-8) auto calc(var(--u)*8);border-radius:50%;background:radial-gradient(#fff8e6,#e9dcbc);border:calc(var(--u)*3) solid var(--gold);object-fit:cover;object-position:50% 20%}
#ovImg[hidden]{display:none}
#ovBtn{
  font-family:inherit;font-size:calc(var(--u)*22);padding:calc(var(--u)*10) calc(var(--u)*38);
  border:0;border-radius:999px;background:var(--gold);color:#2a1a00;cursor:pointer;
  box-shadow:0 calc(var(--u)*4) 0 #9a6b12;
}
#ovBtn:active{transform:translateY(calc(var(--u)*2));box-shadow:0 calc(var(--u)*2) 0 #9a6b12}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="stat"><span class="lbl">Score</span><span id="score">0</span></div>
      <div class="stat mid"><span class="lbl">Level</span><span id="lvl">1</span></div>
      <div class="btns">
        <button id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <button id="bSound" aria-label="Sound on"></button>
      </div>
    </div>
    <div id="bar"><i id="barFill"></i></div>
    <div id="fx"></div>
        <div id="ov" class="show">
      <div class="card">
        <img id="ovImg" alt="" hidden>
        <h1 id="ovT">Nonna's Marbles</h1>
        <p id="ovB"></p>
        <button id="ovBtn">Play</button>
      </div>
    </div>
  </div>
</div>

/* ---------- path: leader from below the screen, then a spiral inward ---------- */
const pts = []; let L = 0;
(function buildPath(){
  const raw = [[CX - 162, H + 30], [CX - 162, CY]];
  const th0 = Math.PI, th1 = Math.PI * 5, r0 = 162, r1 = 84, steps = 1000;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps, th = th0 + (th1 - th0) * t, r = r0 + (r1 - r0) * t;
    raw.push([CX + r * Math.cos(th), CY + r * Math.sin(th)]);
  }
  let last = raw[0]; pts.push(last);
  for (let i = 1; i < raw.length; i++) {
    const b = raw[i];
    let dx = b[0] - last[0], dy = b[1] - last[1], d = Math.hypot(dx, dy);
    while (d >= 1) {
      last = [last[0] + dx / d, last[1] + dy / d]; pts.push(last);
      dx = b[0] - last[0]; dy = b[1] - last[1]; d = Math.hypot(dx, dy);

})();

  if (s <= 0) return { x: pts[0][0], y: pts[0][1] };

  const i = s | 0, f = s - i, a = pts[i], b = pts[i + 1];

  k = k || 1; ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 2.2, R, R * .92, 0, 0, TAU); ctx.fill();
  const g = ctx.createRadialGradient(-4, -5, 1.5, 0, 0, R);
  g.addColorStop(0, '#6b7a78'); g.addColorStop(.5, '#26302f'); g.addColorStop(1, '#0a0f0e');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#e0a93b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(4, -11); ctx.quadraticCurveTo(8, -17, 13, -15); ctx.stroke();
  const f = .5 + .5 * Math.sin(time * 30);
  ctx.fillStyle = f > .5 ? '#ffd25a' : '#ff6a3a'; ctx.beginPath(); ctx.arc(13, -15, 3 + f * 1.5, 0, TAU); ctx.fill();
  ctx.restore();
}
function badge(kind, x, y){
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, TAU); ctx.fillStyle = 'rgba(8,22,18,.9)'; ctx.fill();
  ctx.lineWidth = 1.6; ctx.strokeStyle = '#e0a93b'; ctx.stroke();
  ctx.strokeStyle = '#f3ead2'; ctx.fillStyle = '#f3ead2'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  if (kind === 'slow') { ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -2.8); ctx.lineTo(0, 0); ctx.lineTo(2.4, 1.2); ctx.stroke(); }
  else if (kind === 'rew') { for (const dx of [-3.2, 1.8]) { ctx.beginPath(); ctx.moveTo(dx + 3, -3.6); ctx.lineTo(dx - 1.4, 0); ctx.lineTo(dx + 3, 3.6); ctx.closePath(); ctx.fill(); } }
  else { ctx.beginPath(); ctx.arc(-.8, 1.2, 3.6, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(1.4, -1.4); ctx.lineTo(3.8, -3.6); ctx.stroke(); }
  ctx.restore();
}
function rayHit(a){
  const dx = Math.cos(a), dy = Math.sin(a), r2 = (D * .92) ** 2;
  for (let t = 36; t < 800; t += 5) {
    const x = CX + dx * t, y = CY + dy * t;
    if (x < -10 || x > W + 10 || y < -10 || y > H + 10) return t;
    for (const b of balls) { if (b.s < 0) continue; if ((b.x - x) ** 2 + (b.y - y) ** 2 < r2) return t; }
  }
  return 800;
}
function drawFrog(){
  const ca = Math.cos(frogA), sa = Math.sin(frogA);
  const mad = moodT > 0 && mood === 'scold', happy = moodT > 0 && mood === 'happy';
  if (IMG.n0) {
    // ceramic plate
    ctx.save(); ctx.translate(CX, CY);
    ctx.fillStyle = 'rgba(40,20,5,.35)'; ctx.beginPath(); ctx.arc(0, 3, 54, 0, TAU); ctx.fill();
    const pg = ctx.createRadialGradient(-10, -14, 6, 0, 0, 54);
    pg.addColorStop(0, '#fffaf0'); pg.addColorStop(1, '#e6d8b8');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, 53, 0, TAU); ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = '#2f5fa8'; ctx.beginPath(); ctx.arc(0, 0, 50, 0, TAU); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#e0a93b'; ctx.beginPath(); ctx.arc(0, 0, 53, 0, TAU); ctx.stroke();
    // Nonna, clipped to the plate
    ctx.beginPath(); ctx.arc(0, 0, 47.5, 0, TAU); ctx.clip();
    const im = (mad && IMG.n2) || (happy && IMG.n1) || IMG.n0;
    const shake = mad ? (Math.random() - .5) * 2.4 : 0;
    ctx.translate(-ca * reload * 8 + shake, -sa * reload * 5 + 6); ctx.rotate(ca * .1);
    ctx.drawImage(im, -54, -56, 108, 108);
    ctx.restore();
    ball(nxt, CX + 36, CY + 36, .55);
    const t = reload > 0 ? 1 - reload / .18 : 1;
    const k = (.2 + .8 * t) * .85, hx = CX + ca * 50, hy = CY + sa * 50;
    if (bombArmed) bombIcon(hx, hy, k); else ball(cur, hx, hy, k);
    return;
  }
  const open = mad ? 1 : happy ? .6 : .35;
  ctx.save(); ctx.translate(CX, CY);
  ctx.beginPath(); ctx.arc(0, 0, 44, 0, TAU); ctx.fillStyle = '#5e1824'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#e0a93b'; ctx.stroke();
  ctx.fillStyle = 'rgba(243,234,210,.7)';
  for (let i = 0; i < 22; i++) { const a = i / 22 * TAU; ctx.beginPath(); ctx.arc(Math.cos(a) * 38.5, Math.sin(a) * 38.5, 2.1, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#1d1b22'; ctx.strokeStyle = '#3a3744'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 29, 33, 15, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f6f1dc'; ctx.beginPath(); ctx.moveTo(-10, 21); ctx.lineTo(0, 29); ctx.lineTo(10, 21); ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.translate(-ca * reload * 10 + (mad ? (Math.random() - .5) * 2.4 : 0), -sa * reload * 6); ctx.rotate(ca * .16);
  ctx.fillStyle = '#cfd3d8'; ctx.strokeStyle = '#9aa0a8'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, -31, 10, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -6, 28, 27, 0, 0, TAU); ctx.fillStyle = '#d8dbe0'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -1, 24, 24, 0, 0, TAU); ctx.fillStyle = '#efc7a1'; ctx.fill(); ctx.strokeStyle = '#b98a63'; ctx.stroke();
  ctx.fillStyle = happy ? 'rgba(235,110,110,.6)' : 'rgba(235,110,110,.35)';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 15, 8, happy ? 6.5 : 5, 0, TAU); ctx.fill(); }
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.arc(sx * 10, -4, 7.4, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
    ctx.beginPath(); ctx.arc(sx * 10 + ca * 2.2, -4 + sa * 2.2, 2.8, 0, TAU); ctx.fillStyle = '#2a1a12'; ctx.fill();
    ctx.lineWidth = 1.8; ctx.strokeStyle = '#6b4326'; ctx.beginPath(); ctx.arc(sx * 10, -4, 7.4, 0, TAU); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(-3, -4); ctx.lineTo(3, -4); ctx.stroke();
  ctx.strokeStyle = '#6c6f76'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  const by1 = happy ? -17 : mad ? -20 : -16, by2 = happy ? -17 : mad ? -8 : -10;
  ctx.beginPath(); ctx.moveTo(-18, by1); ctx.lineTo(-4, by2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18, by1); ctx.lineTo(4, by2); ctx.stroke();
  ctx.fillStyle = '#e0ac84'; ctx.beginPath(); ctx.ellipse(0, 5, 3.2, 4, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 14, 6 + open * 4, 3 + open * 6, 0, 0, TAU); ctx.fillStyle = '#4d1018'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#c2273d'; ctx.stroke();
  ctx.strokeStyle = 'rgba(120,80,50,.45)'; ctx.lineWidth = 1;
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 15, 13, 6, sx > 0 ? -.9 : Math.PI - .2, sx > 0 ? .1 : Math.PI + .9); ctx.stroke(); }
  ctx.fillStyle = '#e0a93b';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 24, 6, 2.3, 0, TAU); ctx.fill(); }
  ctx.restore();
  ctx.restore();
  ball(nxt, CX - 36, CY + 31, .62);
  ctx.fillStyle = '#efc7a1'; ctx.strokeStyle = '#b98a63'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(CX - 30, CY + 37, 5.5, 0, TAU); ctx.fill(); ctx.stroke();
  const t = reload > 0 ? 1 - reload / .18 : 1, e = 1 - (1 - t) * (1 - t);
  const rx = CX + 32, ry = CY + 37, ex = CX + ca * 36, ey = CY + sa * 36;
  const hx = ex + (rx - ex) * e, hy = ey + (ry - ey) * e;
  ctx.strokeStyle = '#1d1b22'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(CX + 22, CY + 26); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = '#efc7a1'; ctx.strokeStyle = '#b98a63'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(hx, hy, 6.5, 0, TAU); ctx.fill(); ctx.stroke();
  const k = (.2 + .8 * t) * .85;
  if (bombArmed) bombIcon(hx + 3, hy - 9, k); else ball(cur, hx + 3, hy - 9, k);
}
function draw(dt){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgC, 0, 0);
  ctx.setTransform(px, 0, 0, px, 0, 0);
  if (slowT > 0) { ctx.fillStyle = 'rgba(90,170,255,.13)'; ctx.fillRect(0, 0, W, H); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(150,210,255,.5)'; ctx.strokeRect(3, 3, W - 6, H - 6); }
  if (rewT > 0) { ctx.fillStyle = 'rgba(224,169,59,.12)'; ctx.fillRect(0, 0, W, H); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(224,169,59,.5)'; ctx.strokeRect(3, 3, W - 6, H - 6); }
  const h = balls[0];
  if (h && state !== 'menu' && h.s > L - 400) {
    const k = (h.s - (L - 400)) / 400, hp = pts[L];
    const gl = ctx.createRadialGradient(hp[0], hp[1], 4, hp[0], hp[1], 70);
    const a = .55 * k * (.65 + .35 * Math.sin(time * 9));
    gl.addColorStop(0, 'rgba(255,70,70,' + a + ')'); gl.addColorStop(1, 'rgba(255,70,70,0)');
    ctx.fillStyle = gl; ctx.fillRect(hp[0] - 70, hp[1] - 70, 140, 140);
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i]; if (b.vs < -D) continue;
    const p = posAt(b.vs);
    if (p.y > H + R) continue;
    ball(b.c, p.x + b.ox, p.y + b.oy);
    if (b.p) badge(b.p, p.x + b.ox, p.y + b.oy);
  }
  if (state === 'menu') frogA = -Math.PI / 2 + Math.sin(time * .9) * .55;
  else { let d = aimA - frogA; d = Math.atan2(Math.sin(d), Math.cos(d)); frogA += d * Math.min(1, dt * 22); }
  drawFrog();
  if (state === 'play' && (down || ptype === 'mouse')) {
    const t = rayHit(frogA), ca = Math.cos(frogA), sa = Math.sin(frogA);
    ctx.fillStyle = 'rgba(243,234,210,.55)';
    for (let d = 52; d < t - 12; d += 14) { ctx.beginPath(); ctx.arc(CX + ca * d, CY + sa * d, 1.9, 0, TAU); ctx.fill(); }
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(243,234,210,.6)';
    ctx.beginPath(); ctx.arc(CX + ca * t, CY + sa * t, 6, 0, TAU); ctx.stroke();
  }
  for (const s of shots) { if (s.bomb) bombIcon(s.x, s.y); else ball(s.c, s.x, s.y); }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const r of rings) { ctx.globalAlpha = Math.max(0, r.life * 2); ctx.lineWidth = 4; ctx.strokeStyle = '#ffb347'; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const p of pops) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.font = p.size + "px 'Lilita One','Trebuchet MS',sans-serif";
    const hw = ctx.measureText(p.t).width / 2 + 10;
    const tx = Math.max(hw, Math.min(W - hw, p.x)), ty = Math.max(p.size + 6, Math.min(H - 8, p.y));
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.strokeText(p.t, tx, ty);
    ctx.fillStyle = '#f3ead2'; ctx.fillText(p.t, tx, ty);
  }
  ctx.globalAlpha = 1;
}

/* ---------- HUD and overlay ---------- */
let lastScore = -1, lastLevel = -1;
function hud(){
  if (score !== lastScore) { $('score').textContent = score.toLocaleString(); lastScore = score; }
  if (level !== lastLevel) { $('lvl').textContent = level; lastLevel = level; }
  let fx = '';
  if (bombArmed) fx = 'Bomb armed: fire it!'; else if (slowT > 0) fx = 'Slow ' + Math.ceil(slowT) + 's'; else if (rewT > 0) fx = 'Rewinding';
  if (fx !== lastFx) { const fe = $('fx'); fe.textContent = fx; fe.classList.toggle('on', !!fx); lastFx = fx; }
  const f = state === 'menu' ? 0 : 1 - (remaining + balls.length) / total;
  $('barFill').style.width = Math.max(0, Math.min(100, f * 100)) + '%';
}
let ovFn = null;
function showOverlay(t, b, btn, fn, face){
  const oi = $('ovImg');
  if (face && ART[face]) { oi.src = ART[face]; oi.hidden = false; } else oi.hidden = true;
  $('ovT').textContent = t; $('ovB').textContent = b; $('ovBtn').textContent = btn; ovFn = fn;
  $('ov').classList.add('show');
}
function hideOverlay(){ $('ov').classList.remove('show'); }
$('ovBtn').addEventListener('click', () => { audio(); if (ovFn) ovFn(); });
const iconOn = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const iconOff = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
$('bSound').innerHTML = iconOn;
$('bSound').addEventListener('click', () => {
  audio(); muted = !muted;
  $('bSound').innerHTML = muted ? iconOff : iconOn;
  $('bSound').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
});
function pause(){
  if (state !== 'play') return;
  prevState = state; state = 'paused'; down = false;
  showOverlay('Paused', 'Score ' + score.toLocaleString() + '.', 'Resume', () => { state = prevState; hideOverlay(); }, 'n0');
}
$('bPause').addEventListener('click', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- input ---------- */
function pt(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function aimTo(p){ if (Math.hypot(p.x - CX, p.y - CY) > 12) aimA = Math.atan2(p.y - CY, p.x - CX); }
cv.addEventListener('pointerdown', e => {
  audio(); ptype = e.pointerType; if (state !== 'play') return;
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = pt(e); down = true; downSwap = Math.hypot(p.x - CX, p.y - CY) < 40;
  if (!downSwap) aimTo(p);
});
cv.addEventListener('pointermove', e => {
  ptype = e.pointerType;
  if (state === 'play' && (down || e.pointerType === 'mouse')) { const p = pt(e); if (!(down && downSwap)) aimTo(p); }
});
cv.addEventListener('pointerup', e => {
  if (!down) return; down = false;
  const p = pt(e);
  if (downSwap && Math.hypot(p.x - CX, p.y - CY) < 40) swap();
  else { aimTo(p); fire(p.x, p.y); }
});
cv.addEventListener('pointercancel', () => { down = false; });
window.addEventListener('keydown', e => { if (e.code === 'Space' && state === 'play') { e.preventDefault(); swap(); } });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

/* ---------- boot ---------- */
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildBg);
demoChain();
showOverlay('Nonna\'s Marbles', 'Tap where you want to shoot, or hold and drag to line up a shot, then let go to fire. Tap Nonna to swap marbles. Match three or more of a color before the chain reaches the hole.', 'Play', startGame, 'n0');
loadArt().then(() => { buildBg(); buildSprites(); });
let lastT = 0;
function frame(t){
  const dt = Math.min(.033, (t - lastT) / 1000 || 0); lastT = t; time += dt;
  if (state !== 'paused') update(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
