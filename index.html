<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nonna's Marbles</title>
<meta name="theme-color" content="#05130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nonna's Marbles">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  box-sizing:border-box;
  --bg:#05130f;--ink:#f3ead2;--gold:#e0a93b;--u:1px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;background:var(--bg);color:var(--ink);
  font-family:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;border-radius:calc(var(--u)*14);background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{
  position:absolute;left:0;right:0;top:0;
  display:flex;justify-content:flex-start;align-items:flex-start;gap:calc(var(--u)*10);
  padding:calc(var(--u)*12) calc(var(--u)*14) calc(var(--u)*24);pointer-events:none;
  background:linear-gradient(90deg,rgba(5,19,15,.8),rgba(5,19,15,.55) 50%,rgba(5,19,15,0) 76%);
}
.stat{text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.5);display:flex;flex-direction:column;font-size:calc(var(--u)*28);line-height:1;min-width:calc(var(--u)*72)}
.stat.mid{align-items:center}
.lbl{font-size:calc(var(--u)*12);opacity:.7;letter-spacing:.05em;margin-bottom:calc(var(--u)*3)}
.lives{font-size:calc(var(--u)*11);line-height:1;margin-top:calc(var(--u)*3);letter-spacing:calc(var(--u)*1.5);color:#ff4d4d;text-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.5)}
.lives i{font-style:normal}
.lives i.x{opacity:.28}
.btns{display:flex;gap:calc(var(--u)*8);pointer-events:auto;justify-content:flex-start}
.btns button{
  width:calc(var(--u)*38);height:calc(var(--u)*38);border-radius:50%;
  background:rgba(5,19,15,.6);border:calc(var(--u)*1.5) solid rgba(224,169,59,.55);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;
}
.btns button:focus-visible,#ovBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btns svg{width:55%;height:55%;fill:currentColor}
#fx,#toast{
  position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;
  padding:calc(var(--u)*5) calc(var(--u)*16);border-radius:999px;white-space:nowrap;
  background:rgba(5,19,15,.85);border:calc(var(--u)*1.5) solid var(--gold);font-size:calc(var(--u)*17);
}
#fx{top:calc(var(--u)*88);display:none}
#fx.on{display:block}
#toast{top:calc(var(--u)*128);opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#bar{position:absolute;left:calc(var(--u)*14);width:calc(var(--u)*178);top:calc(var(--u)*74);height:calc(var(--u)*5);border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;pointer-events:none}
#barFill{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width .25s}
#ov{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(3,12,9,.5);
}
#ov.show{display:flex}
.card{
  width:80%;padding:calc(var(--u)*26) calc(var(--u)*20) calc(var(--u)*24);text-align:center;
  background:linear-gradient(#17413a,#0d2823);
  border:calc(var(--u)*2.5) solid var(--gold);border-radius:calc(var(--u)*20);
  box-shadow:inset 0 0 0 calc(var(--u)*4) rgba(0,0,0,.25),0 calc(var(--u)*12) calc(var(--u)*34) rgba(0,0,0,.55);
}
.card h1{font-weight:400;font-size:calc(var(--u)*42);line-height:1.05;text-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.45)}
.card p{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:calc(var(--u)*14.5);line-height:1.45;opacity:.92;margin:calc(var(--u)*12) auto calc(var(--u)*20);max-width:30ch;
}
#ovImg{display:block;width:calc(var(--u)*130);height:calc(var(--u)*130);margin:calc(var(--u)*-8) auto calc(var(--u)*8);border-radius:50%;background:radial-gradient(#fff8e6,#e9dcbc);border:calc(var(--u)*3) solid var(--gold);object-fit:cover;object-position:50% 20%}
#ovImg[hidden]{display:none}
#ovBtn{
  font-family:inherit;font-size:calc(var(--u)*22);padding:calc(var(--u)*10) calc(var(--u)*38);
  border:0;border-radius:999px;background:var(--gold);color:#2a1a00;cursor:pointer;
  box-shadow:0 calc(var(--u)*4) 0 #9a6b12;
}
#ovBtn:active{transform:translateY(calc(var(--u)*2));box-shadow:0 calc(var(--u)*2) 0 #9a6b12}
#ovMeta{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:calc(var(--u)*12.5);color:var(--gold);margin-top:calc(var(--u)*14);opacity:.9}
#ovMeta[hidden]{display:none}
#rotate{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);color:var(--ink);align-items:center;justify-content:center;text-align:center;font-size:22px;padding:24px}
@media (orientation:landscape) and (pointer:coarse) and (max-height:520px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="stat"><span class="lbl">Score</span><span id="score">0</span></div>
      <div class="stat mid"><span class="lbl">Level</span><span id="lvl">1</span><span id="lives" class="lives"></span></div>
      <div class="btns">
        <button id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <button id="bSound" aria-label="Sound on"></button>
      </div>
    </div>
    <div id="bar"><i id="barFill"></i></div>
    <div id="fx"></div>
    <div id="toast"></div>
        <div id="ov" class="show">
      <div class="card">
        <img id="ovImg" alt="" hidden>
        <h1 id="ovT">Nonna's Marbles</h1>
        <p id="ovB"></p>
        <button id="ovBtn">Play</button>
        <div id="ovMeta" hidden></div>
      </div>
    </div>
  </div>
</div>
<div id="rotate">Turn your phone upright to play</div>

// Every track starts with a straight leader rising from below the screen, then the shape, ending at the hole.
function spiralTrack(o){
  const { a0 = Math.PI, dir = 1, turns = 2, r0 = 162, r1 = 84, sx = 1, sy = 1, wob = 0, k = 0, p = 2 } = o;
  const out = [], steps = 1400;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, th = a0 + dir * turns * TAU * t;
    const r = r0 + (r1 - r0) * t + wob * Math.sin(k * (th - a0));
    const c = Math.cos(th), s = Math.sin(th);
    const q = p === 2 ? 1 : 1 / Math.pow(Math.pow(Math.abs(c), p) + Math.pow(Math.abs(s), p), 1 / p);
    out.push([CX + r * c * q * sx, CY + r * s * q * sy]);
  }

}
function polyTrack(wp, rad){
  // straight segments joined by rounded corners
  const out = [wp[0]];

    const a = wp[i - 1], b = wp[i], c = wp[i + 1];
    const d1 = Math.hypot(b[0] - a[0], b[1] - a[1]), d2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
    const r = Math.min(rad, d1 / 2, d2 / 2);
    const p1 = [b[0] + (a[0] - b[0]) / d1 * r, b[1] + (a[1] - b[1]) / d1 * r];
    const p2 = [b[0] + (c[0] - b[0]) / d2 * r, b[1] + (c[1] - b[1]) / d2 * r];
    out.push(p1);
    for (let j = 1; j < 12; j++) {

    }

  }

}

  () => spiralTrack({ sy: 1.42, r0: 160 }),                                                // 3 tall oval

  () => spiralTrack({ wob: 10, k: 5, r0: 150, r1: 94, turns: 1.2 }),                      // 5 flower

  () => spiralTrack({ a0: 0, dir: -1, sy: 1.3, wob: 9, k: 3, r0: 150, r1: 86, turns: 1.45 }), // 10 wobbly oval
  () => spiralTrack({ p: 1.5, r0: 160, r1: 94, turns: 1.5 }),                             // 11 diamond
  () => polyTrack([[22, 110], [82, 110], [82, 590], [278, 590], [278, 250], [338, 250],

  () => spiralTrack({ a0: 0, dir: -1, p: 3, sy: 1.2, r0: 156, r1: 84, turns: 1.85 }),     // 14 squircle
  () => spiralTrack({ a0: 0, dir: -1, sy: 1.36, r0: 162, r1: 76, turns: 2.25 })            // 15 long tall spiral
];
let pts = [], L = 0, trackNo = 0;
function buildPath(n){
  trackNo = n;
  const shape = TRACKS[n % TRACKS.length]();
  const st = shape[0];
  const raw = [[st[0], H + 30], ...shape];
  pts = [];
  let last = raw[0]; pts.push(last);
  for (let i = 1; i < raw.length; i++) {
    const b = raw[i];
    let dx = b[0] - last[0], dy = b[1] - last[1], d = Math.hypot(dx, dy);
    while (d >= 1) {
      last = [last[0] + dx / d, last[1] + dy / d]; pts.push(last);
      dx = b[0] - last[0]; dy = b[1] - last[1]; d = Math.hypot(dx, dy);

// seconds the chain takes to cross the whole track at base speed: generous early, shrinking towards a 34 s floor.
// Speed is derived from this, so a long track and a short track give the same time at the same level.
function levelTime(lv){ return 34 + 68 / (1 + (lv - 1) / 5); }
function chainSpeed(lv){ return Math.min(70, TRACK_L[(lv - 1) % TRACKS.length] / levelTime(lv)); }

function posAt(s){
  if (s <= 0) return { x: pts[0][0], y: pts[0][1] };

  const i = s | 0, f = s - i, a = pts[i], b = pts[i + 1];

function tone(f, t, type, vol, slide){
  if (muted || !AC) return;
  const n = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + t);

  o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n + t);
}
// little mandolin-style victory jingle: a bouncy arpeggio with a sparkle on top
function winJingle(){
  if (muted || !AC) return;
  const t0 = AC.currentTime + .05;
  const notes = [[392, 0], [523, .11], [659, .22], [784, .33], [659, .44], [784, .55], [1047, .7]];
  const pluck = (f, at, len, vol) => {
    for (const [mul, type, v] of [[1, 'triangle', vol], [2, 'sine', vol * .35]]) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f * mul, at);
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(v, at + .012); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at + len + .02);
    }
  };
  notes.forEach(([f, d], i) => {
    const last = i === notes.length - 1;
    pluck(f, t0 + d, last ? .9 : .22, last ? .22 : .16);
    if (!last) pluck(f, t0 + d + .055, .16, .07);       // quick tremolo double-pluck
  });

}

/* ---------- sprites and background ---------- */
let spr = [], bgC = document.createElement('canvas');
function buildSprites(){
  spr = COLORS.map((col, ci) => {
    const s = Math.ceil((2 * R + 6) * px), c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d'); g.scale(px, px);
    const m = R + 3;

function buildBg(){

      if (b.s >= L) {
        const p = posAt(L);
        for (let j = 0; j < 4; j++) parts.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 120, vy: (Math.random() - .5) * 120, life: .4, c: COLORS[b.c].base, r: 2.5 });
        balls.splice(i, 1);
      }
    }
    syncPos(dt, true);
    if (!balls.length) {
      state = 'over'; lives--;
      say('Mamma mia, no!', 'scold', true, 'Mama_mia_no', false, true);
      if (score > best) { best = score; saveBest(); }
      if (lives > 0) showOverlay('It got through!', 'Score ' + score.toLocaleString() + '. ' + lives + (lives === 1 ? ' life' : ' lives') + ' left.', 'Retry level ' + level, startLevel, 'n2', bestLine());
      else showOverlay('Mamma mia!', 'Game over. Score ' + score.toLocaleString() + '. You reached level ' + level + '.', 'Play again', startGame, 'n2', bestLine());
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.life -= dt; p.y -= (p.v || 26) * dt;
    if (p.life <= 0) pops.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.r += 260 * dt; r.life -= dt; if (r.life <= 0) rings.splice(i, 1); }
  if (moodT > 0) moodT -= dt;
  hud();
}

/* ---------- drawing ---------- */
function ball(c, x, y, k){
  k = k || 1; const sz = (2 * R + 6) * k;
  ctx.drawImage(spr[c], x - sz / 2, y - sz / 2, sz, sz);
}
function bombIcon(x, y, k){
  k = k || 1; ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 2.2, R, R * .92, 0, 0, TAU); ctx.fill();
  const g = ctx.createRadialGradient(-4, -5, 1.5, 0, 0, R);
  g.addColorStop(0, '#6b7a78'); g.addColorStop(.5, '#26302f'); g.addColorStop(1, '#0a0f0e');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#e0a93b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(4, -11); ctx.quadraticCurveTo(8, -17, 13, -15); ctx.stroke();
  const f = .5 + .5 * Math.sin(time * 30);
  ctx.fillStyle = f > .5 ? '#ffd25a' : '#ff6a3a'; ctx.beginPath(); ctx.arc(13, -15, 3 + f * 1.5, 0, TAU); ctx.fill();
  ctx.restore();
}
function badge(kind, x, y, sc, c, k){
  ctx.save(); ctx.translate(x, y); if (sc) ctx.scale(sc, sc);
  ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, TAU); ctx.fillStyle = c != null ? DEEP[c] : 'rgba(8,22,18,.9)'; ctx.fill();
  if (c != null && k != null) { ctx.fillStyle = 'rgba(' + RGB[c] + ',' + (.6 * k) + ')'; ctx.fill(); }
  ctx.lineWidth = 1.6 + (k || 0); ctx.strokeStyle = c != null ? GLOW[c] : '#e0a93b'; ctx.stroke();
  ctx.strokeStyle = '#f3ead2'; ctx.fillStyle = '#f3ead2'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  if (kind === 'slow') { ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -2.8); ctx.lineTo(0, 0); ctx.lineTo(2.4, 1.2); ctx.stroke(); }
  else if (kind === 'rew') { for (const dx of [-3.2, 1.8]) { ctx.beginPath(); ctx.moveTo(dx + 3, -3.6); ctx.lineTo(dx - 1.4, 0); ctx.lineTo(dx + 3, 3.6); ctx.closePath(); ctx.fill(); } }
  else { ctx.beginPath(); ctx.arc(-.8, 1.2, 3.6, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(1.4, -1.4); ctx.lineTo(3.8, -3.6); ctx.stroke(); }
  ctx.restore();
}
function rayHit(a){
  const dx = Math.cos(a), dy = Math.sin(a), r2 = (D * .92) ** 2;
  for (let t = 36; t < 800; t += 5) {
    const x = CX + dx * t, y = CY + dy * t;
    if (x < -10 || x > W + 10 || y < -10 || y > H + 10) return t;
    for (const b of balls) { if (b.s < 0) continue; if ((b.x - x) ** 2 + (b.y - y) ** 2 < r2) return t; }
  }
  return 800;
}
function drawFrog(){
  const ca = Math.cos(frogA), sa = Math.sin(frogA);
  const mad = moodT > 0 && mood === 'scold', happy = moodT > 0 && mood === 'happy';
  if (IMG.n0) {
    // ceramic plate with Nonna on it (a plain plate if the art failed to load)
    ctx.save(); ctx.translate(CX, CY);
    const env = moodT > 0 ? Math.min(1, (moodDur - moodT) / .12) * Math.min(1, moodT / .35) : 0;
    const pop = 1 + .38 * env * env * (3 - 2 * env);
    ctx.scale(pop, pop);
    ctx.fillStyle = 'rgba(40,20,5,.35)'; ctx.beginPath(); ctx.arc(0, 3, 54, 0, TAU); ctx.fill();
    const pg = ctx.createRadialGradient(-10, -14, 6, 0, 0, 54);
    pg.addColorStop(0, '#fffaf0'); pg.addColorStop(1, '#e6d8b8');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, 53, 0, TAU); ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = '#2f5fa8'; ctx.beginPath(); ctx.arc(0, 0, 50, 0, TAU); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#e0a93b'; ctx.beginPath(); ctx.arc(0, 0, 53, 0, TAU); ctx.stroke();
    // Nonna, clipped to the plate
    ctx.beginPath(); ctx.arc(0, 0, 47.5, 0, TAU); ctx.clip();
    const im = (mad && IMG.n2) || (happy && IMG.n1) || IMG.n0;
    const shake = mad ? (Math.random() - .5) * 2.4 : 0;
    ctx.translate(-ca * reload * 8 + shake, -sa * reload * 5 + 6); ctx.rotate(ca * .1);
    ctx.drawImage(im, -66, -58, 132, 132);
    ctx.restore();
    ball(nxt, CX - ca * 40, CY - sa * 40, .55);
    const t = reload > 0 ? 1 - reload / .18 : 1;
    const k = (.2 + .8 * t) * .85, hx = CX + ca * 50, hy = CY + sa * 50;
    if (bombArmed) bombIcon(hx, hy, k); else ball(cur, hx, hy, k);
    return;
  }
  ctx.save(); ctx.translate(CX, CY); ctx.fillStyle = '#e6d8b8'; ctx.beginPath(); ctx.arc(0, 0, 53, 0, TAU); ctx.fill(); ctx.restore();
  ball(nxt, CX - ca * 40, CY - sa * 40, .55); ball(cur, CX + ca * 50, CY + sa * 50, .85);
}
function draw(dt){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgC, 0, 0);
  ctx.setTransform(px, 0, 0, px, 0, 0);
  // screen tint matches the colour of the power-up in use
  const tint = c => { const v = RGB[c]; ctx.fillStyle = 'rgba(' + v + ',.13)'; ctx.fillRect(0, 0, W, H); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(' + v + ',.55)'; ctx.strokeRect(3, 3, W - 6, H - 6); };
  if (slowT > 0) tint(PCOL.slow);
  if (rewT > 0) tint(PCOL.rew);
  if (bombArmed) tint(PCOL.bomb);
  const h = balls[0];
  if (h && state !== 'menu' && h.s > L - 400) {
    const k = (h.s - (L - 400)) / 400, hp = pts[L];
    const gl = ctx.createRadialGradient(hp[0], hp[1], 4, hp[0], hp[1], 70);
    const a = .55 * k * (.65 + .35 * Math.sin(time * 9));
    gl.addColorStop(0, 'rgba(255,70,70,' + a + ')'); gl.addColorStop(1, 'rgba(255,70,70,0)');
    ctx.fillStyle = gl; ctx.fillRect(hp[0] - 70, hp[1] - 70, 140, 140);
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i]; if (b.vs < -D) continue;
    const p = posAt(b.vs);
    if (p.y > H + R) continue;
    const bx = p.x + b.ox, by = p.y + b.oy;
    ball(b.c, bx, by);
    if (b.p) {
      // the pulse stays inside the marble so it never spills onto its neighbours
      const k = .5 + .5 * Math.sin(time * 7);
      badge(b.p, bx, by, .85 + .25 * k, b.c, k);
    }
  }
  if (state === 'menu') frogA = -Math.PI / 2 + Math.sin(time * .9) * .55;
  else { let d = aimA - frogA; d = Math.atan2(Math.sin(d), Math.cos(d)); frogA += d * Math.min(1, dt * 22); }
  drawFrog();
  if (state === 'play' && (down || ptype === 'mouse')) {
    const t = rayHit(frogA), ca = Math.cos(frogA), sa = Math.sin(frogA);
    ctx.fillStyle = 'rgba(243,234,210,.55)';
    for (let d = 52; d < t - 12; d += 14) { ctx.beginPath(); ctx.arc(CX + ca * d, CY + sa * d, 1.9, 0, TAU); ctx.fill(); }
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(243,234,210,.6)';
    ctx.beginPath(); ctx.arc(CX + ca * t, CY + sa * t, 6, 0, TAU); ctx.stroke();
  }
  for (const s of shots) { if (s.bomb) bombIcon(s.x, s.y); else ball(s.c, s.x, s.y); }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const r of rings) { ctx.globalAlpha = Math.max(0, r.life * 2); ctx.lineWidth = 4; ctx.strokeStyle = '#ffb347'; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const p of pops) {
    ctx.globalAlpha = Math.min(1, p.life * 2.5) * .9;
    ctx.font = p.size + "px 'Lilita One','Trebuchet MS',sans-serif";
    const hw = ctx.measureText(p.t).width / 2 + 10;
    const tx = Math.max(hw, Math.min(W - hw, p.x)), ty = Math.max(p.size + 6, Math.min(H - 8, p.y));
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.strokeText(p.t, tx, ty);
    ctx.fillStyle = '#f3ead2'; ctx.fillText(p.t, tx, ty);
  }
  ctx.globalAlpha = 1;
}

/* ---------- HUD and overlay ---------- */
let lastScore = -1, lastLevel = -1, lastLives = -1;
function hud(){
  if (score !== lastScore) { $('score').textContent = score.toLocaleString(); lastScore = score; }
  if (level !== lastLevel) { $('lvl').textContent = level; lastLevel = level; }
  if (lives !== lastLives) { $('lives').innerHTML = [0, 1, 2].map(i => '<i' + (i < lives ? '' : ' class="x"') + '>♥</i>').join(''); lastLives = lives; }
  let fx = '';
  if (bombArmed) fx = 'Bomb armed: fire it!'; else if (slowT > 0) fx = 'Slow ' + Math.ceil(slowT) + 's'; else if (rewT > 0) fx = 'Rewinding';
  if (fx !== lastFx) { const fe = $('fx'); fe.textContent = fx; fe.classList.toggle('on', !!fx); lastFx = fx; }
  const f = state === 'menu' ? 0 : 1 - (remaining + balls.length) / total;
  $('barFill').style.width = Math.max(0, Math.min(100, f * 100)) + '%';
}
let ovFn = null;
function showOverlay(t, b, btn, fn, face, meta){
  const oi = $('ovImg');
  if (face && ART[face]) { oi.src = ART[face]; oi.hidden = false; } else oi.hidden = true;
  $('ovT').textContent = t; $('ovB').textContent = b; $('ovBtn').textContent = btn; ovFn = fn;
  $('ovMeta').textContent = meta || ''; $('ovMeta').hidden = !meta;
  $('ov').classList.add('show');
}
function hideOverlay(){ $('ov').classList.remove('show'); }
$('ovBtn').addEventListener('click', () => { audio(); if (ovFn) ovFn(); });
const iconOn = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const iconOff = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const iconNoMusic = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 4.5v8.2a2 2 0 1 1-1.4-1.9V4.5z"/><path d="M16 16l6 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
function soundUI(){
  const b = $('bSound');
  b.innerHTML = muted ? iconOff : musicOn ? iconOn : iconNoMusic;
  b.setAttribute('aria-label', muted ? 'Sound off' : musicOn ? 'Sound and music on' : 'Music off');
}
// tap cycles: sound + music -> sound only -> silent -> sound + music
$('bSound').addEventListener('click', () => {
  audio();
  if (!muted && musicOn) musicOn = false;
  else if (!muted) muted = true;
  else { muted = false; musicOn = true; }
  try { localStorage.setItem('nm-music', musicOn ? '1' : '0'); localStorage.setItem('nm-sound', muted ? '0' : '1'); } catch (e) {}
  soundUI(); musicSync();
  toast(muted ? 'Sound off' : musicOn ? 'Sound and music on' : 'Music off');
});
soundUI();
function pause(){
  if (state !== 'play') return;
  prevState = state; state = 'paused'; down = false;
  showOverlay('Paused', 'Score ' + score.toLocaleString() + '.', 'Resume', () => { state = prevState; hideOverlay(); musicSync(); }, 'n0');
}
$('bPause').addEventListener('click', pause);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(); if (mEl) mEl.pause(); }   // the game pauses, so the music must too
  else musicSync();
});

/* ---------- input ---------- */
function pt(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function aimTo(p){ if (Math.hypot(p.x - CX, p.y - CY) > 12) aimA = Math.atan2(p.y - CY, p.x - CX); }
cv.addEventListener('pointerdown', e => {
  audio(); ptype = e.pointerType; if (state !== 'play') return;
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = pt(e); down = true; downSwap = Math.hypot(p.x - CX, p.y - CY) < 54;   // the whole plate swaps
  if (!downSwap) aimTo(p);
});
cv.addEventListener('pointermove', e => {
  ptype = e.pointerType;
  if (state === 'play' && (down || e.pointerType === 'mouse')) { const p = pt(e); if (!(down && downSwap)) aimTo(p); }
});
cv.addEventListener('pointerup', e => {
  if (!down) return; down = false;
  const p = pt(e);
  if (downSwap && Math.hypot(p.x - CX, p.y - CY) < 54) swap();
  else { aimTo(p); fire(p.x, p.y); }
});
cv.addEventListener('pointercancel', () => { down = false; });
window.addEventListener('keydown', e => { if (e.code === 'Space' && state === 'play') { e.preventDefault(); swap(); } });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

/* ---------- boot ---------- */
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildBg);
demoChain();
showOverlay('Nonna\'s Marbles', 'Tap where you want to shoot, or hold and drag to line up a shot, then let go to fire. Tap Nonna to swap marbles. Match three or more of a colour before the chain reaches the hole.', 'Play', startGame, 'n0', best > 0 ? bestLine() : '');
loadArt().then(() => { buildBg(); buildSprites(); });
let lastT = 0;
function frame(t){
  const dt = Math.min(.033, (t - lastT) / 1000 || 0); lastT = t; time += dt;
  if (state !== 'paused') update(dt);
  musicTick(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
